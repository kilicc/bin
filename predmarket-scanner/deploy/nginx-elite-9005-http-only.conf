# HTTP only — domain yokken sunucu IP ile panel (GCP demo başlangıç)
limit_req_zone $binary_remote_addr zone=elite_panel:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    auth_basic "Elite 9005 Demo";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;

    limit_req zone=elite_panel burst=60 nodelay;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
