# Elite full stack — nginx reverse proxy (3 subdomain → 9005/9006/9007)
# /etc/nginx/sites-available/elite-full

limit_req_zone $binary_remote_addr zone=elite_panel:10m rate=30r/s;

# ── 9005 BERSERK2 ──
server {
    listen 80;
    listen [::]:80;
    server_name 9005.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 9005.example.com;

    auth_basic "Elite 9005";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;

    limit_req zone=elite_panel burst=60 nodelay;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

