# Domain yok — tek statik IP, 3 port (Seçenek B)
# 9085 → 9005 BERSERK2 | 9086 → 9006 MEGA | 9087 → 9007 MEGA+Admin+Lab
# /etc/nginx/sites-available/elite-full-ports

limit_req_zone $binary_remote_addr zone=elite_panel:10m rate=30r/s;

server {
    listen 9085;
    listen [::]:9085;
    server_name _;

    auth_basic "Elite 9005";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;
    limit_req zone=elite_panel burst=60 nodelay;
    client_max_body_size 4m;

    # Statik panel (CSS/JS) — basic auth bazen 401 verip sayfayı kilitlemesin
    location /panel-assets/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 9086;
    listen [::]:9086;
    server_name _;

    auth_basic "Elite 9006 MEGA";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;
    limit_req zone=elite_panel burst=60 nodelay;
    client_max_body_size 8m;

    location /panel-assets/ {
        auth_basic off;
        add_header Cache-Control "public, max-age=86400" always;
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 9087;
    listen [::]:9087;
    server_name _;

    auth_basic "Elite 9007 MEGA+Lab";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;
    limit_req zone=elite_panel burst=60 nodelay;
    client_max_body_size 16m;

    location /panel-assets/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
