# Elite 9005 panel — nginx reverse proxy (TLS certbot ile tamamlanır)
# /etc/nginx/sites-available/elite-9005

limit_req_zone $binary_remote_addr zone=elite_panel:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;

    # certbot --nginx sonrası ssl_certificate satırları eklenir
    # ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    auth_basic "Elite 9005";
    auth_basic_user_file /etc/nginx/.htpasswd_elite;

    limit_req zone=elite_panel burst=60 nodelay;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
